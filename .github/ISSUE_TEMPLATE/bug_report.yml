name: Bug 报告
description: 报告可复现的问题；请勿提交密钥、Cookie 或私人内容。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请删除 API Key、Cookie、私人链接、完整转写稿、本机绝对路径和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 知录版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 内容来源
      options:
        - B 站
        - 小宇宙
        - 抖音
        - 其他公开视频
        - 与媒体来源无关
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及你原本期待什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 粘贴一个可公开访问的链接……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11、Python 3.13、Node.js 22、浏览器版本
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图
      description: 不要粘贴 .env、Cookie、私人内容或含用户名的绝对路径。
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不含密钥、Cookie、私人链接、个人知识稿或其他敏感数据。
          required: true

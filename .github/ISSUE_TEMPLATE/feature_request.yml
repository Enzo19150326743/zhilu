name: 功能建议
description: 提议一个符合本地知识沉淀方向的改进。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 请描述使用场景，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果有界面或流程设想，可以一并说明。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你尝试过的替代方法
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议不要求绕过平台权限、分享凭据或抓取私人内容。
          required: true

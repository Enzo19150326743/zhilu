    <text x="25" y="207" fill="#fffdf8" font-size="31" font-weight="900">变成你的本地知识库。</text>
    <text x="0" y="284" fill="#40392f" font-size="24" font-weight="700">粘贴链接 → 本地转写 → AI 理解 → Obsidian</text>

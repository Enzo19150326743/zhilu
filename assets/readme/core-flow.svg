<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">从链接到本地知识库的完整链路</title>
  <desc id="desc">粘贴链接，使用本地模型转写音视频，再由 AI 理解内容，最后存进 Obsidian。</desc>
  <rect x="2" y="2" width="1196" height="306" fill="#f4efe6" stroke="#181713" stroke-width="4"/>
  <text x="44" y="62" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="900" fill="#181713">从一条链接，到一份本地知识</text>

  <g transform="translate(44 103)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <g><rect x="7" y="7" width="236" height="124" fill="#181713"/><rect width="236" height="124" fill="#71c7b8" stroke="#181713" stroke-width="3"/><text x="24" y="50" font-size="23" font-weight="800">01</text><text x="24" y="91" font-size="31" font-weight="900">粘贴链接</text></g>
    <path d="M252 62h38" stroke="#d84a2d" stroke-width="6"/><path d="m276 48 16 14-16 14" fill="none" stroke="#d84a2d" stroke-width="6"/>
    <g transform="translate(306)"><rect x="7" y="7" width="236" height="124" fill="#181713"/><rect width="236" height="124" fill="#f4c95d" stroke="#181713" stroke-width="3"/><text x="24" y="50" font-size="23" font-weight="800">02</text><text x="24" y="91" font-size="31" font-weight="900">本地转写</text></g>
    <path d="M558 62h38" stroke="#d84a2d" stroke-width="6"/><path d="m582 48 16 14-16 14" fill="none" stroke="#d84a2d" stroke-width="6"/>
    <g transform="translate(612)"><rect x="7" y="7" width="210" height="124" fill="#181713"/><rect width="210" height="124" fill="#d84a2d" stroke="#181713" stroke-width="3"/><text x="24" y="50" fill="#fff" font-size="23" font-weight="800">03</text><text x="24" y="91" fill="#fff" font-size="31" font-weight="900">AI 理解</text></g>
    <path d="M838 62h38" stroke="#d84a2d" stroke-width="6"/><path d="m862 48 16 14-16 14" fill="none" stroke="#d84a2d" stroke-width="6"/>
    <g transform="translate(892)"><rect x="7" y="7" width="196" height="124" fill="#181713"/><rect width="196" height="124" fill="#776fd2" stroke="#181713" stroke-width="3"/><text x="22" y="50" fill="#fff" font-size="23" font-weight="800">04</text><text x="22" y="91" fill="#fff" font-size="27" font-weight="900">存进 Obsidian</text></g>
  </g>
</svg>
